# Checks after every push to main (work is committed straight to main, CLAUDE.md) and on any pull request: unit
# tests (incl. the whole-season sweeps), the production build, and the Playwright end-to-end tests against that build.
# The data update's own pushes (GITHUB_TOKEN) do not trigger it; that workflow runs its own tests.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    # Pinned: Playwright 1.56 cannot install its browser on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            screenshots/
            test-results/
          if-no-files-found: ignore
