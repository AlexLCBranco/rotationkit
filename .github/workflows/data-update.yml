# Daily data update: fetch new finished games from cdn.nba.com (Path B, no stats.nba.com), normalize,
# validate, test, and commit the new data to main (Vercel then redeploys production).
# Any failing step fails the run and nothing is committed; GitHub emails the repo owner about failed runs.
name: Daily data update

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC, after all US games have finished
  workflow_dispatch: {}
  # Dry run (no commit) on pushes to work branches that touch the pipeline: checks the CDN from GitHub's runners.
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/data-update.yml'
      - 'scripts/**'
      - 'src/domain/**'
      - 'src/shared/**'

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check cdn.nba.com is reachable from this runner
        run: npx tsx scripts/probe-cdn.ts
      - name: Fetch → normalize → validate → test → commit
        env:
          GIT_AUTHOR_NAME: ${{ vars.DATA_COMMIT_NAME || 'github-actions[bot]' }}
          GIT_AUTHOR_EMAIL: ${{ vars.DATA_COMMIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ vars.DATA_COMMIT_NAME || 'github-actions[bot]' }}
          GIT_COMMITTER_EMAIL: ${{ vars.DATA_COMMIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        # Commits only for the scheduled/manual run on main; everything else is a dry run.
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx tsx scripts/ci-update.ts --commit
          else
            npx tsx scripts/ci-update.ts
          fi
